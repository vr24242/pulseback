# fly.toml app configuration file generated for pulseback on 2026-05-12T23:06:18+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pulseback'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app    = "npm --prefix /app/apps/shopify run start"
  worker = "node build/worker/index.js"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['worker']
